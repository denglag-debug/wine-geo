# Либурне — «правый берег» Бордо вокруг города Либурн: Сент-Эмильон, Помроль, Фронсак и их соседи.
type: subregion
name: Либурне
latin: Libournais
summary: >-
  Либурне — правый берег Бордо вокруг города Либурн, у слияния рек Иль и Дордонь. Здесь
  царствует Мерло: на глинах и известняке он даёт мягкие, округлые красные вина. Самые известные
  имена — Сент-Эмильон и Помроль; вокруг Сент-Эмильона лежат четыре «сателлита», которым разрешено
  добавлять его имя к своему: Монтань, Люссак, Пюисеген и Сен-Жорж.[1]
draft_note: "Черновик: паспорт субрегиона, карта всех AOC и климат появятся при наполнении."
