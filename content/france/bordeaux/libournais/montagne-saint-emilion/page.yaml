# КОРОТКО
# -----------------------------------------------------------------------------
summary: >-
  Монтань-Сент-Эмильон — аппелласьон на правом берегу Бордо, сразу к северу от знаменитого
  Сент-Эмильона: их разделяет только ручей Барбанна. Это самый большой из четырёх «сателлитов»
  Сент-Эмильона.[13, 14] Здесь делают **только красное вино**, обычно ассамбляж (смесь) с большой долей
  **Мерло** — не меньше 75 % посадок.[1, 3] Виноградники лежат на холмах из глины и известняка
  вокруг деревни Монтань и бывших деревень Парсак и Сен-Жорж. Вино по стилю близко к Сент-Эмильону,
  но стоит заметно дешевле.

facts:
  - "Самый большой из «сателлитов» Сент-Эмильона: ≈ 1 500–1 600 га.[3, 4, 14]"
  - "Статус AOC с 14 ноября 1936 года; имя «Сент-Эмильон» к названию коммуны разрешил суд Либурна ещё в 1921-м.[1]"
  - "На холме Калон — высшей точке Либурне (114 м) — стоят ветряные мельницы XVI–XVII веков.[1]"

