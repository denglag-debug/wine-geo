# ИСТОРИЯ
# -----------------------------------------------------------------------------
history:
  - {date: IV век, year: 350, chart: IV в., short: вилла «века Авзония», key: true,
     text: "Здесь стоит галло-римская вилла «века Авзония» — поэта IV века из Бурдигалы (Бордо). Свод правил INAO пишет, что лозы растут в Монтане «почти две тысячи лет».[1]"}
  - {date: XI–XII века, year: 1100, chart: XI–XII вв., short: романские церкви,
     text: "Строятся романские церкви: Сен-Жорж (XI век, на римских руинах) и Сен-Мартен в Монтане (XII век, с куполом, единственным в своём роде в Либурне).[11]"}
  - {date: "1152", year: 1152, chart: "1152", short: Алиенора и Англия,
     text: "Алиенора Аквитанская выходит замуж за Генриха Плантагенета, и Аквитания на триста лет отходит английской короне. Вино Бордо уходит в Англию.[1]"}
  - {date: "1270", year: 1270, chart: "1270", short: основан Либурн,
     text: "Англичане основывают Либурн — порт на Дордони, через который вино правого берега отправляют на кораблях в Англию.[1]"}
  - {date: XIV век, year: 1350,
     text: "Построен замок Шато-де-Тур (Château des Tours) — с двумя многоугольными донжонами.[1, 11]"}
  - {date: XVI–XVII века, year: 1600, chart: XVII в., short: мельницы Калона,
     text: "На холме Калон строят ветряные мельницы; когда-то в коммуне их было около двадцати. Последняя мельница остановилась в 1951 году.[1, 10]"}
  - {date: Конец XIX века, year: 1880, chart: конец XIX в., short: филлоксера,
     text: "Филлоксера (тля, погубившая большую часть виноградников Европы). Лозы пересаживают на привитые подвои — и с этого времени главным сортом становится Мерло.[1]"}
  - {date: 24 ноября 1921, year: 1921, chart: "1921", short: суд Либурна, key: true,
     text: "Суд Либурна разрешает виноделам Монтаня писать «Сент-Эмильон» — но только вместе с названием своей коммуны. Так появляется имя «Монтань-Сент-Эмильон».[1]"}
  - {date: 14 ноября 1936, year: 1936, chart: "1936", short: статус AOC, key: true,
     text: "Указ о создании AOC Монтань-Сент-Эмильон — в тот же день, что и у Сент-Эмильона и Пюисегена.[1, 7, 9]"}
  - {date: "1973", year: 1973, chart: "1973", short: Парсак и Сен-Жорж,
     text: "Коммуны Сен-Жорж и Парсак присоединены к коммуне Монтань. Аппелласьон Сен-Жорж-Сент-Эмильон остаётся отдельным.[10]"}
  - {date: "1978", year: 1978,
     text: "Жан-Клод Берруэ, винодел Петрюса (самого знаменитого вина Помроля), покупает 4 га в Монтане — так начинается Vieux Château Saint-André.[16]"}
  - {date: "2011", year: 2011,
     text: "Утверждён современный свод правил AOP (декрет № 2011-1805 от 6 декабря 2011).[2]"}
  - {date: "2019", year: 2019, chart: "2019", short: новые правила,
     text: "Действующая редакция правил (arrêté от 10 апреля 2019): уточнены границы участков; в списке сортов — вспомогательные Карменер и Пти Вердо (в документе 2016 года их ещё не было).[1, 2]"}
  - {date: 2023–2026, year: 2024,
     text: "Кризис сбыта в Бордо: с августа 2023 года в Жиронде выкорчёвано около 21 000 га лоз, только за 2025 год площадь упала на 9 %.[6]"}
timeline_caption: Ключевые даты (интервалы не в масштабе). Залитые точки — самые важные события.
timeline_src: [1, 6, 10, 11, 16]

