    - {name: Церковь Сен-Жорж, text: "XI век, построена на римских руинах, колокольня 23 м. Исторический памятник с 1920 года.[10, 11]"}
    - {name: Церковь Нотр-Дам в Парсаке, text: "самая маленькая церковь коммуны, исторический памятник с 2002 года.[10, 11]"}
