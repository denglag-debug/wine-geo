    months: [5, 6, 9, 10]
    text: май–июнь (дни открытых дверей, цветение лозы) и сентябрь–октябрь (сбор урожая). Многие хозяйства закрыты по понедельникам.

# -----------------------------------------------------------------------------
# СЛОВАРИК
# -----------------------------------------------------------------------------
glossary:
  - term: AOC / AOP
    def: "«Контролируемое / защищённое наименование по происхождению» — закон, который определяет, где, из чего и как можно делать вино с этим названием."
  - term: Аппелласьон
    def: "территория и название вина с AOC (здесь — Монтань-Сент-Эмильон)."
  - term: Сателлиты Сент-Эмильона
    def: "четыре аппелласьона к северу от Сент-Эмильона, которым разрешено добавлять его имя к своему: Монтань, Люссак, Пюисеген и Сен-Жорж."
  - term: Правый берег
    def: "часть Бордо к северу и востоку от Дордони (Либурне, Блай, Бур); здесь главный сорт — Мерло. На «левом берегу» (Медок, Грав) главный — Каберне Совиньон."
  - term: Либурне
    def: "винный край вокруг города Либурн: Сент-Эмильон, Помроль, Фронсак и их соседи."
  - term: Ассамбляж
    def: "смешивание вин из разных сортов или участков в одно вино; в Бордо почти все красные вина — ассамбляжи."
  - term: Известняк с астериями
    def: "«calcaire à astéries» — светлый известняк, в котором много окаменевших морских звёзд; основа холмов Сент-Эмильона и Монтаня."
  - term: Молассы
    def: "древние (третичного периода) песчано-глинистые отложения, нанесённые реками и озёрами."
  - term: Терруар
    def: "всё вместе, что влияет на вино в конкретном месте: почва, склон, климат, традиции."
  - term: Гектолитр (гл)
    def: "100 литров ≈ 133 бутылки по 0,75 л."
  - term: Урожайность, гл/га
    def: "сколько вина получают с гектара виноградника."
  - term: Глазок
    def: "почка на лозе, из которой весной вырастает побег с гроздями."
  - term: Мильдью
    def: "грибковая болезнь винограда, любит сырую тёплую погоду."
  - term: Биодинамика
    def: "способ ведения хозяйства без химии, с особыми природными препаратами и работами по лунному календарю; сертификат — Demeter."
  - term: Амфора
    def: "большой глиняный сосуд для брожения или выдержки вина; в отличие от новой дубовой бочки не даёт вину вкуса дерева."

