# page.yaml — хаб «Бордо» (упрощённый шаблон: регион). Черновик каркаса (создан 17.11.2026
# вместе со страницей Монтань-Сент-Эмильон). Полный паспорт региона — при наполнении.
type: region
name: Бордо
latin: Bordeaux
summary: >-
  Бордо — крупнейший винодельческий регион Франции по площади виноградников под AOC: почти весь
  департамент Жиронда. В 2025 году здесь было 91 543 га виноградников, из них 86 600 га — под
  наименованиями AOP.[1] Регион делят по рекам: левый берег Гаронны и Жиронды (Медок, Грав),
  «междуречье» Антр-де-Мер и правый берег Дордони — Либурне с Сент-Эмильоном и Помролем.
draft_note: "Черновик: паспорт региона с цифрами, историей и картой всех AOC появится при наполнении."
