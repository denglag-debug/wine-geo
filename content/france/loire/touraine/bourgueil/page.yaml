# =============================================================================
# page.yaml — ДАННЫЕ страницы AOC Бургёй.
#
# Как читать этот файл (формат YAML):
#   ключ: значение          — одна настройка;
#   - элемент               — элемент списка;
#   отступы (2 пробела)     — показывают, что вложено во что;
#   # текст                 — комментарий, генератор его не читает.
#
# В текстах можно писать:
#   **жирный**, [1] или [1, 6] — сноска на источник номер 1 (номер = место в списке sources ниже);
#   {{ fmt(s.area_ha) }}       — подставить число из блока stats (s = stats), красиво отформатированное.
# Длинные тексты разделов лежат в соседнем файле text.md.
# =============================================================================

type: aoc                    # уровень: country | region | subregion | aoc
name: Бургёй                 # по-русски
name_prep: Бургёе            # «в Бургёе» — для подписей вроде «Что посмотреть в …»
latin: Bourgueil             # как на этикетке
kicker: Аппелласьон (AOC)
pronounce: Произносится «бургёй» — с ударением на последний слог, «ё» как в слове «мёд».
updated: 2026-11-09          # дата последней проверки данных
position: [0.179, 47.283]    # долгота, широта — точка на картах (главная, хабы, мини-карта)
highlight_deps: ["37"]       # какой департамент закрасить на мини-карте (37 = Эндр-и-Луара)

# Кнопки скачивания. Файлы лежат в папке страницы.
# Кнопки скачивания. Карточка (card) пока берётся готовым файлом из пилота — её генератор перенесём следующим шагом.
downloads:
  - {title: Карточка для печати, file: bourgueil-card.pdf, main: true}
  - {title: Полный PDF, file: bourgueil.pdf, auto: true}   # auto — PDF делает tools/make_pdf.js из готовой страницы

# Блок «Выше / Рядом / Ниже» генератор заполняет сам по папкам.
# Здесь — только то, что из папок не следует:
see_also:                    # «Рядом», но из другого субрегиона
  - {name: Сомюр-Шампиньи, note: уже Анжу-Сомюр}
below_note: официальных подзон нет; на этикетке можно указать название участка (lieu-dit)

# -----------------------------------------------------------------------------
# КОРОТКО: описание, три факта, паспорт
# -----------------------------------------------------------------------------
summary: >-
  Бургёй — небольшой аппелласьон на правом берегу Луары, примерно в 40 минутах езды на запад от Тура.
  Здесь делают почти только красное вино, и почти целиком из одного сорта — **Каберне Фран**, которое местные
  по старинке зовут «бретон». Виноградники лежат двумя полосами: внизу, у реки, — песок и гравий (лёгкие,
  фруктовые вина), выше, на склоне, — мягкий известняк туф (плотные вина, которые выдерживают годами).
  Вино здесь делают больше тысячи лет: первые письменные следы связаны с бенедиктинским аббатством, основанным в 990 году.[1, 6]

facts:
  - "Одна из главных «столиц» Каберне Фран во Франции: по закону он — основа каждого вина.[1]"
  - "Два стиля в одном аппелласьоне: «гравий» — пить молодым, «туф» — можно хранить 10 лет и дольше.[6, 12]"
  - Статус AOC с 31 июля 1937 года — одним из первых во Франции.[1]

# Цифры «для машины»: из них считаются паспорт, сквозная «Статистика», сравнения.
stats:
  area_ha: 1400              # га, InterLoire [6]
  area_year: 2023
  production:
    avg_hl: 63089            # среднее за avg_period, INAO [2]
    avg_period: 2011–2015
    last_hl: 65366
    last_year: 2015
  colors:                    # доли цветов в производстве (2015, INAO [2]): розовое 3 065 из 65 366 гл
    red: 0.953
    rose: 0.047
  status: AOC
  status_year: 1937
  producers: 215             # хозяйств, сдающих декларацию (2017) [2]
  yield_legal: 55            # гл/га по закону
  yield_real: 42.5           # гл/га, средняя за 10 лет до 2016 [2]
  density: 4500              # лоз на гектар, минимум по закону
  grapes:                    # сорта: для раздела «Сорта» всего сайта
    - {name: Каберне Фран, latin: Cabernet Franc, color: red, role: главный}
    - {name: Каберне Совиньон, latin: Cabernet Sauvignon, color: red, role: до 10 %}

passport:
  - [Название, Bourgueil (Бургёй)]
  - [Страна → регион, Франция → Долина Луары → Турень → Бургёй]
  - [Статус, "AOC с 31.07.1937 (сейчас — AOP, «защищённое наименование» по правилам ЕС); действующие правила — от 29.11.2023[1]"]
  - [Площадь виноградников, "**≈ {{ fmt(s.area_ha) }} га**[6] (1 405 га в границах аппелласьона, 1 365 га плодоносят — данные 2017)[2]"]
  - [Производство, "**{{ fmt(s.production.avg_hl) }} гл** в среднем за {{ s.production.avg_period }} = {{ fmt(liters_mln(s.production.avg_hl), 1) }} млн литров ≈ **{{ fmt(bottles_mln(s.production.avg_hl), 1) }} млн бутылок**<br>
      последний опубликованный год ({{ s.production.last_year }}): {{ fmt(s.production.last_hl) }} гл ≈ {{ fmt(bottles_mln(s.production.last_hl), 1) }} млн бутылок[2]
      <div class=\"note\">Более свежих открытых данных именно по Бургёю мы не нашли: InterLoire и Agreste публикуют цифры по всему департаменту (см. «Года урожая»).</div>"]
  - [Цвета вин, "красное ≈ {{ pct(s.colors.red) }} %, розовое ≈ {{ pct(s.colors.rose) }} % (2015)[2]; белого и игристого в AOC нет[1]"]
  - [Производители, "{{ s.producers }} хозяйств сдают декларацию об урожае, из них 120 живут в основном виноградарством (2017)[2]; 2 кооператива и 5 негоциантов (данные 2011)[12]"]
  - [Коммуны (8), "Бене, Бургёй, Ля-Шапель-сюр-Луар, Шузе-сюр-Луар, Ингранд-де-Турен и Сен-Патрис (обе — сейчас в составе Кото-сюр-Луар), Рестинье, Сен-Никола-де-Бургёй (частично)[1]"]
  - [Главный сорт, "Каберне Фран («бретон»); Каберне Совиньон — не больше 10 %[1]"]
minimap_caption: Бургёй на карте Франции. Розовым — департамент Эндр-и-Луара.

# -----------------------------------------------------------------------------
# ИСТОРИЯ: события. Попадают и в таймлайн страницы, и в общую «Историю» сайта.
#   date  — как писать дату в списке;   year — число для сортировки по времени;
#   chart — подпись на ленте (если нет — событие только в списке);
#   short — короткая подпись на ленте;  key: true — важное (залитая точка).
# -----------------------------------------------------------------------------
history:
  - {date: IV век, year: 350, chart: IV в., short: св. Мартин,
     text: "Виноградарство в Турени распространяется вместе с христианством — традиция связывает его со святым Мартином Турским и его учениками.[6, 12]"}
  - {date: "990", year: 990, chart: "990", short: основано аббатство, key: true,
     text: "Основано бенедиктинское аббатство Сен-Пьер-де-Бургёй — с него начинаются письменные упоминания здешних виноградников.[1, 6]"}
  - {date: XI–XII века, year: 1150, chart: "1189", short: аббат Бодри,
     text: "Союз Анжу и Аквитании помогает распространению Каберне Фран на Луаре. В 1189 году аббат Бодри (Baudry) расхваливает монастырь и его вино.[1]"}
  - {date: XVI век, year: 1534, chart: "1534", short: Рабле хвалит вино,
     text: "Вино Бургёя хвалят Ронсар и Рабле; у Рабле в 1534 году — «доброе бретонское вино».[6, 15]"}
  - {date: XVII век, year: 1650, chart: XVII в., short: экспорт,
     text: "Вино уходит вниз по Луаре к морю и дальше — во Фландрию и Голландию.[1, 6]"}
  - {date: "1831", year: 1831, chart: "1831", short: Бальзак,
     text: "У Бальзака в «Мэтре Корнелиусе» король Людовик XI просит «доброго вина из Бургёя».[12]"}
  - {date: Конец XIX века, year: 1880, chart: конец XIX в., short: филлоксера,
     text: "Филлоксера (тля, погубившая большую часть виноградников Европы). Лозы на старых песчаных террасах держались дольше других — в песке вредитель живёт хуже.[1, 12]"}
  - {date: 31 июля 1937, year: 1937, chart: "1937", short: статус AOC, key: true,
     text: "Указ о создании AOC Бургёй. Соседний Сен-Никола-де-Бургёй получает отдельный аппелласьон в том же году.[1, 14]"}
  - {date: 1960–1970-е, year: 1965,
     text: "Лошадей на виноградниках сменяют высокие тракторы-«анжамбёры», которые идут над рядом лоз.[12]"}
  - {date: "2009", year: 2009, chart: "2009", short: свод правил AOP,
     text: "Утверждён современный свод правил AOP (указ от 15 октября 2009).[12]"}
  - {date: "2018", year: 2018,
     text: "Второй Дом вин Бургёя (Maison des vins) открывается у подножия замка Ланже; первый работал в фамильном доме актёра Жана Карме.[6]"}
  - {date: "2023", year: 2023, chart: "2023", short: новые правила,
     text: "Новая редакция правил: 12 глазков на лозу вместо 11, «потолок» урожайности снижен с 67 до 65 гл/га.[1, 2]"}
timeline_caption: Ключевые даты (интервалы не в масштабе). Залитые точки — самые важные события.
timeline_src: [1, 6, 12, 15]

