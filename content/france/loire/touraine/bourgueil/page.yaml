# СЛОВАРИК: попадает и на страницу, и в общий «Словарь» сайта.
# -----------------------------------------------------------------------------
glossary:                   # term — термин, def — объяснение
  - term: AOC / AOP
    def: "«Контролируемое / защищённое наименование по происхождению» — закон, который определяет, где, из чего и как можно делать вино с этим названием."
  - term: Аппелласьон
    def: "территория и название вина с AOC (здесь — Бургёй)."
  - term: INAO
    def: "Национальный институт происхождения и качества — государственный орган Франции, который утверждает правила AOC."
  - term: Терруар
    def: "всё вместе, что влияет на вино в конкретном месте: почва, склон, климат, традиции."
  - term: Туф (туффо)
    def: "мягкий светлый известняк Долины Луары; из него строили замки, в нём вырублены погреба."
  - term: Гектолитр (гл)
    def: "100 литров ≈ 133 бутылки по 0,75 л."
  - term: Урожайность, гл/га
    def: "сколько вина получают с гектара виноградника."
  - term: Глазок
    def: "почка на лозе, из которой весной вырастает побег с гроздями."
  - term: Шпалера
    def: "проволока на столбиках, вдоль которой подвязывают лозу."
  - term: Малолактика
    def: "«второе» брожение: резкая яблочная кислота превращается в мягкую молочную."
  - term: Милдью
    def: "грибковая болезнь винограда, любит сырую тёплую погоду."
  - term: Лье-ди (lieu-dit)
    def: "историческое название небольшого участка земли; может стоять на этикетке."
  - term: Негоциант
    def: "торговый дом, который покупает виноград или вино у виноградарей и продаёт под своей маркой."

