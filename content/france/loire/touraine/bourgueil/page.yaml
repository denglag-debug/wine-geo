tourism:
  sights:
    - {name: Королевское аббатство Сен-Пьер-де-Бургёй, text: "основано в 990 году; монастырские постройки, сады, музей народных традиций (около 1 500 предметов). Открыто с апреля по начало ноября.[18, 19]"}
    - {name: Погреб-музей «Дива бутылка» (Cave de la Dive Bouteille), text: "в деревне Шевретт — экскурсия по пещерному погребу в туфе и дегустация, около часа.[20]"}
    - {name: Синяя мельница (Moulin Bleu), text: "мельница XV века над виноградниками с видом на долину (сейчас ресторан).[18]"}
    - {name: Замок Ланже, text: "один из старейших каменных донжонов Франции, 16 обставленных залов, подъёмный мост.[18]"}
    - {name: Замок Жизё, text: "в лесу к северу, знаменит двумя галереями настенной живописи.[18]"}
    - {name: Замок Юссе, text: "виден с парома через Луару у Ля-Шапель-сюр-Луар.[18]"}
  nearby: "Рядом: крепость Шинон и аббатство Фонтевро (усыпальница Плантагенетов) — 15–20 минут на машине."
  getting_there:
    - {how: На машине, text: "около 30 минут на запад от Тура по дороге D952.[18]"}
    - {how: На поезде, text: "региональные поезда TER Тур — Сомюр останавливаются в Сен-Патрисе, Ля-Шапель-сюр-Луар и Пор-Буле (ближайшая станция к Бургёю).[18]"}
    - {how: На велосипеде, text: "по маршруту «Луара на велосипеде» (La Loire à Vélo); у Пор-Буле есть ответвление к виноградникам.[18]"}
    - {how: Паром, text: "через Луару у Ля-Шапель-сюр-Луар — летом по выбранным дням.[18]"}
  festivals:                  # month — номер месяца, для календаря на сайте
