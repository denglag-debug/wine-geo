# world.yaml — список стран на главной странице.
# Это не страница (у файла нет своей папки), генератор читает его только для главной.

# Страны, страниц которых ещё нет, но которые точно будут. На главной они показаны серыми плитками «скоро».
# iso — двухбуквенный код страны (FR — Франция, IT — Италия, ES — Испания, DE — Германия…).
# ПРИМЕР: список составлен для демонстрации — поправьте под свои планы.
planned:
  - {name: Италия, latin: Italia, iso: IT}
  - {name: Испания, latin: España, iso: ES}
  - {name: Португалия, latin: Portugal, iso: PT}
  - {name: Германия, latin: Deutschland, iso: DE}
