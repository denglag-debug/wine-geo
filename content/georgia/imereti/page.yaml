summary: >-
  Имерети — главный винный регион западной Грузии, вокруг города Кутаиси. Здесь три наименования места происхождения: Свири, Обча и Сазано Оцханури.[1, 2] Белое Свири делают из местных сортов Цоликоури, Цицка и Крахуна, красное Сазано Оцханури — из сорта Оцханури Сапере.[2, 3]
