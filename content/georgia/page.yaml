# page.yaml — страница-хаб «Грузия» (упрощённый шаблон: страна).
# ЧЕРНОВИК КАРКАСА: полный паспорт страны (площадь виноградников, история, сорта) — при наполнении.
type: country
name: Грузия
latin: Sakartvelo / Georgia
iso: GE                        # код страны (ISO) — по нему страна закрашивается на карте главной
order: 2
summary: >-
  Грузия — одна из древнейших винодельческих стран мира. Здесь до сих пор делают вино
  в квеври — больших глиняных сосудах, закопанных в землю; этот способ внесён ЮНЕСКО
  в список нематериального культурного наследия (2013).[1] Вместо французских AOC в Грузии
  действуют «наименования места происхождения» (PDO): в 2024 году их было 30.[2]
draft_note: "Черновик: паспорт страны с цифрами и источниками появится при наполнении (шаг 4 плана)."
children_title: Винные регионы
