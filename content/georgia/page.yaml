# =============================================================================
# page.yaml — ДАННЫЕ страницы-хаба «Грузия» (уровень: страна).
# Тексты разделов лежат рядом, в text.md. Здесь — цифры, диаграммы, история, источники.
# Правило: каждая цифра — со сноской [N] на источник; чего в источниках нет — не пишем.
# =============================================================================
type: country
name: Грузия
latin: Sakartvelo / Georgia
iso: GE                        # код страны (ISO) — по нему страна закрашивается на карте главной
order: 2
updated: 2026-11-16
summary: >-
  Грузия — одна из древнейших винодельческих стран мира: самые старые известные следы вина
  найдены именно здесь, им около 8 000 лет.[8] До сих пор часть вина делают в квеври — больших
  глиняных сосудах, закопанных в землю; этот способ внесён ЮНЕСКО в список нематериального
  культурного наследия (2013).[1] Вместо французских AOC в Грузии действуют «наименования места
  происхождения» (PDO): к концу 2025 года их стало 33.[2, 9] Три четверти виноградников и почти
  весь урожай даёт один регион — Кахетия.[2, 4]
children_title: Винные регионы
map:                           # настройки мини-карт страны (см. такой же блок у Франции)
  bbox: [41.4, 46.8, 41.0, 43.3]
  # Контур страны (geo/country.geojson, regions.geojson) дан без Абхазии и Южной Осетии —
  # решение Дениса от 17.11.2026. Границы этих территорий взяты из Natural Earth (disputed areas).
  capital: ["Тбилиси", 44.834, 41.691]
  capital_offset: [-52, 14]    # подпись столицы — левее и ниже точки, чтобы не наехать на Кахетию
  rivers: ["Kura", "Alazani"]
  river_label: ["Кура", 43.55, 41.80]

# -----------------------------------------------------------------------------
# ЦИФРЫ. В text.md к ним обращаемся так: {{ fmt(s.harvest_t) }}
# -----------------------------------------------------------------------------
stats:
  vineyard_ha: 59900           # га, конец 2024 — Геостат (через FreshPlaza) [5]
  vineyard_year: 2024
  vineyard_nwa_ha: 55000       # га, 2022 — оценка Национального агентства вина [4]
  harvest_t: 340000            # т, переработано винограда в 2025 [2]
  harvest_year: 2025
  harvest_kakheti_t: 327000    # т, Кахетия, 2025 [2]
  harvest_prev_t: 320000       # т, 2024 [3]
  growers: 22000               # виноградарей сдали урожай в 2025 [2]
  wineries: 730                # компаний приняли виноград в 2025 [2]
  export_ml: 89.7              # млн литров вина на экспорт, 2025 [2]
  export_usd: 267.9            # млн долларов, 2025 [2]
  export_countries: 71         # стран, 2025 [2]
  export_russia_ml: 60.8       # млн литров в Россию, 2025 [6]
  pdo: 33                      # наименований места происхождения, конец 2025 [2, 9]

# -----------------------------------------------------------------------------
# ИСТОРИЯ. year — для сортировки в общем разделе «История»; chart/short — подпись на ленте.
# -----------------------------------------------------------------------------
history:
  - {date: "около 6000–5800 лет до нашей эры", year: -6000, chart: "≈ 6000 до н. э.", short: древнейшее вино, key: true,
     text: "В глиняных сосудах из поселений Гадачрили-Гора и Шулаверис-Гора (к югу от Тбилиси) найдены химические следы виноградного вина. На сегодня это древнейшее известное свидетельство виноделия в мире.[8]"}
  - {date: "1980", year: 1980, chart: "1980", short: "пик: 111,5 тыс. га",
     text: "Наибольшая площадь виноградников в истории страны — 111,5 тыс. га. Это вдвое больше, чем сегодня.[4]"}
  - {date: "2004", year: 2004, chart: "2004", short: "спад: 45 тыс. га",
     text: "После распада СССР площадь виноградников упала до 45 тыс. га — в два с половиной раза меньше, чем в 1980 году.[4]"}
  - {date: "2006", year: 2006, chart: "2006", short: запрет в России, key: true,
     text: "Россия, главный покупатель, запрещает ввоз грузинского вина. Экспорт падает с 41 млн долларов в 2006 году до 29 млн в 2007-м; виноделам приходится искать новые рынки.[7]"}
  - {date: "2013", year: 2013, chart: "2013", short: "рынок открыт; ЮНЕСКО", key: true,
     text: "Россия снимает запрет: экспорт вырастает с 23 млн бутылок (2012) до 46 млн.[7] В том же году способ делать вино в квеври внесён в список нематериального наследия ЮНЕСКО.[1]"}
  - {date: "2021", year: 2021,
     text: "Экспорт впервые превышает 100 млн бутылок: 107 млн бутылок в 62 страны.[7]"}
  - {date: "2024", year: 2024,
     text: "Зарегистрировано 30-е наименование места происхождения — Обча (Имерети).[3]"}
  - {date: "2025", year: 2025, chart: "2025", short: рекордный урожай,
     text: "Самый большой урожай за 30 лет — около 340 тыс. тонн винограда. Наименований места происхождения становится 33: добавлены Рача, Лечхуми и Сазано Оцханури.[2, 9]"}
timeline_caption: Ключевые даты (интервалы не в масштабе). Залитые точки — самые важные события.
timeline_src: [1, 2, 4, 7, 8]

