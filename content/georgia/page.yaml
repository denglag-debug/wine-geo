# -----------------------------------------------------------------------------
# СЛОВАРИК (эти термины попадают и в общий «Словарь» сайта)
# -----------------------------------------------------------------------------
glossary:
  - term: Квеври
    def: "большой глиняный сосуд в форме яйца, закопанный в землю по горлышко. В нём вино бродит и выдерживается; способ внесён в список наследия ЮНЕСКО.[1]"
  - term: PDO
    def: "«наименование места происхождения» (Protected Designation of Origin) — грузинский аналог французского AOC: название вина закреплено за определённой местностью и правилами."
  - term: Ртвели
    def: "сбор винограда и праздник урожая в Грузии."
  - term: Кадастр виноградников
    def: "государственный реестр, куда вносят каждый участок: где он, какой площади, какие сорта посажены. В Грузии его ведёт Национальное агентство вина.[3]"

