summary: >-
  Гурия — небольшой регион на западе Грузии, у Чёрного моря. Своих наименований места происхождения здесь пока нет.[1] С 2024 года Национальное агентство вина вносит виноградники Гурии в кадастр — государственный реестр участков.[2]
