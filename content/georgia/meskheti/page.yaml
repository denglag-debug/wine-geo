summary: >-
  Месхети — исторический винный регион на юге Грузии (край Самцхе-Джавахети). Своих наименований места происхождения здесь пока нет.[1] В 2024 году для кадастра виноградников сняли с воздуха окрестности Аспиндзы и Абастумани.[2]
