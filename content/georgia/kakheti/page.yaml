# page.yaml — хаб «Кахетия» (упрощённый шаблон: регион). Черновик каркаса.
# У Грузии нет уровня «субрегион»: наименования (PDO) лежат прямо в папке региона.
type: region
order: 1                       # порядок в списке регионов на странице «Грузия»
name: Кахетия
latin: Kakheti
highlight_deps: ["GE-KA"]      # какой край закрасить на карте Грузии (код ISO)
summary: >-
  Кахетия — главный винный край Грузии, на востоке страны, в долине реки Алазани между
  Кавказским хребтом и Цив-Гомборским хребтом. В 2025 году здесь собрали около 327 тыс. тонн
  винограда — почти весь урожай страны (около 340 тыс. т).[1] Из 33 грузинских наименований
  места происхождения 20 — кахетинские.[1]
draft_note: "Черновик: паспорт региона с цифрами и источниками появится при наполнении (шаг 4 плана)."
