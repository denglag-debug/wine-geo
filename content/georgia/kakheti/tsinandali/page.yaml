# -----------------------------------------------------------------------------
# КОРОТКО
# -----------------------------------------------------------------------------
summary: >-
  Цинандали — наименование места происхождения в Кахетии, на востоке Грузии. Название
  дало село Цинандали, где в XIX веке поэт и генерал Александр Чавчавадзе построил винный погреб
  и стал делать вино «по-европейски».[1, 8] По закону это **сухое белое из Ркацители** (не меньше 85 %)
  с добавкой Мцване Кахури, а также сухое красное из Саперави. Виноград собирают в 15 сёлах на
  правом берегу реки Алазани, на склонах высотой 350–700 м.[1]

facts:
  - "Одно из первых наименований Грузии: зарегистрировано под № 3 в 2005 году.[1]"
  - "Белое Цинандали — «европейского» типа: сок бродит без кожицы, а не в квеври с мезгой, как традиционные кахетинские вина.[1]"
  - "В усадьбе Чавчавадзе хранится коллекция из 16 500 с лишним старых бутылок.[8]"

stats:
  area_ha: 653               # га — «сырьевая зона», документ Сакпатенти [2], год не указан
  area_year: н/д
  status: PDO
  status_year: 2005
  yield_legal: 65            # гл/га — пересчёт: 10 т/га × 650 л/т [1]
  rkats_t_ha: 10             # т/га, предел для Ркацители [1]
  l_per_t: 650               # л вина из тонны винограда, предел [1]
  harvest_t: 4571            # т, урожай зоны по документу Сакпатенти [2]
  potential_hl: 29700        # гл, «потенциал» зоны там же (297 000 дал)
  colors_text: белое, красное (доли не публикуются)
  grapes:
    - {name: Ркацители, latin: Rkatsiteli, color: white, role: главный в белом (≥ 85 %)}
    - {name: Мцване Кахури, latin: Mtsvane Kakhuri, color: white, role: в белом до 15 %}
    - {name: Саперави, latin: Saperavi, color: red, role: единственный сорт красного}

