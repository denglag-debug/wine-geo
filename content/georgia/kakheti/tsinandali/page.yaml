  - [Статус, "наименование места происхождения № 3, зарегистрировано в Грузии 30.08.2005; заявитель — Национальное агентство вина. Защищено и в реестре географических указаний Великобритании[1]"]
  - [Площадь, "**≈ {{ fmt(s.area_ha) }} га** — «сырьевая зона» по документу Сакпатенти (год данных не указан)[2]"]
