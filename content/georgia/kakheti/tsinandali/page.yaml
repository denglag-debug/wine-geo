  festivals:
    - {name: Ртвели — сбор винограда, month: 9, date: конец сентября, note: в восточной Грузии, src: [13]}
    - {name: Фестиваль классической музыки «Цинандали», date: ежегодно с 2019 года, note: даты — на сайте фестиваля, src: [8]}
