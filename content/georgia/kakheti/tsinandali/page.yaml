# -----------------------------------------------------------------------------
# СЛОВАРИК
# -----------------------------------------------------------------------------
glossary:
  - term: Квеври
    def: "большой глиняный сосуд для брожения и хранения вина; его закапывают в землю по горлышко."
  - term: Марани
    def: "грузинский винный погреб, где стоят квеври."
  - term: PDO / наименование места происхождения
    def: "грузинский аналог французского AOC: закон определяет, где, из каких сортов и как делают вино с этим названием."
  - term: Микрозона
    def: "небольшая территория, из винограда которой можно делать вино с данным наименованием (у Цинандали — 15 сёл)."
  - term: Ркацители
    def: "древний грузинский белый сорт; название значит «красный рог» (по красноватой ножке грозди). Самый собираемый сорт Грузии."
  - term: Мцване Кахури
    def: "«зелёный кахетинский» — белый сорт; в Цинандали его добавляют для свежести."
  - term: Саперави
    def: "главный красный сорт Грузии, с окрашенной (красной) мякотью."
  - term: Ртвели
    def: "сбор винограда и праздник урожая в Грузии."
  - term: Национальное агентство вина
    def: "государственное агентство Грузии, которое следит за наименованиями и публикует статистику вина."
  - term: Сакпатенти
    def: "Национальный центр интеллектуальной собственности Грузии; регистрирует наименования места происхождения."
  - term: Удельное ведомство
    def: "в Российской империи — управление землями и хозяйствами царской семьи."
  - term: Ведро (мера)
    def: "старая русская мера жидкости, ≈ 12,3 литра."
  - term: Тонна на гектар (т/га)
    def: "в Грузии урожай ограничивают в тоннах винограда с гектара, а не в гектолитрах вина, как во Франции."

