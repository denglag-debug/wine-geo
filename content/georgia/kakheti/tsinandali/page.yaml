# -----------------------------------------------------------------------------
# ИСТОРИЯ
# -----------------------------------------------------------------------------
history:
  - {date: "1106", year: 1106, chart: "1106", short: академия Икалто, key: true,
     text: "При царе Давиде Строителе Арсен Икалтоели основывает академию при монастыре Икалто (около 16 км по прямой к северо-западу от Цинандали). Среди предметов — виноградарство и виноделие.[9]"}
  - {date: "1616", year: 1616, chart: "1616", short: Икалто сожжён,
     text: "Академию Икалто сжигают войска персидского шаха Аббаса I.[9]"}
  - {date: "1786–1846", year: 1786,
     text: "Годы жизни Александра Чавчавадзе — поэта, генерала, владельца имения Цинандали.[8]"}
  - {date: "1835", year: 1835, chart: "1835", short: погреб Чавчавадзе, key: true,
     text: "Чавчавадзе берёт в банке «миллион рублей» на обустройство имений. В Цинандали строят большой винный погреб с лабораторией; вина узнают в России и Европе.[1]"}
  - {date: "1880", year: 1880, chart: "1880", short: Удельное ведомство,
     text: "Имения в Цинандали и вокруг (около 2 000 га) покупает Удельное ведомство Российской империи — управление землями царской семьи.[1]"}
  - {date: "1886–1887", year: 1886,
     text: "Построены двухэтажный завод-погреб на 150 000 вёдер (≈ 1,8 млн литров), дворец и бочарная мастерская.[1]"}
  - {date: "1892", year: 1892, chart: "1892", short: медали в Чикаго,
     text: "По своду правил, на международной выставке в Чикаго высшие оценки получили «Ркацители Цинандали № 13», «Зелёное Цинандали № 14» и «Саперави Цинандали № 16». (Всемирная выставка в Чикаго проходила в 1893 году; год дан как в документе.)[1]"}
  - {date: "1897", year: 1897,
     text: "В Цинандали открывается трёхлетняя школа (по своду правил).[1]"}
  - {date: "1947", year: 1947, chart: "1947", short: музей,
     text: "Усадьба Чавчавадзе становится музеем.[8]"}
  - {date: 30 августа 2005, year: 2005, chart: "2005", short: PDO № 3, key: true,
     text: "«Цинандали» зарегистрировано в Грузии как наименование места происхождения № 3.[1]"}
  - {date: "2007", year: 2007,
     text: "Усадьбу реставрирует компания Silk Road Group.[8]"}
  - {date: "2013", year: 2013, chart: "2013", short: квеври — ЮНЕСКО,
     text: "Древний грузинский способ делать вино в квеври внесён в список нематериального наследия ЮНЕСКО.[10]"}
  - {date: "2019", year: 2019, chart: "2019", short: фестиваль,
     text: "Первый фестиваль классической музыки «Цинандали»; сад усадьбы входит в Европейскую сеть исторических садов.[8]"}
timeline_caption: Ключевые даты (интервалы не в масштабе). Залитые точки — самые важные события.
timeline_src: [1, 8, 9, 10]

