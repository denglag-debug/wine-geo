  - [Цвета вин, "белое сухое и красное сухое; доли не публикуются[1]"]
  - [Микрозона, "15 сёл Телавского муниципалитета на правом берегу Алазани, между ущельями Чуматхеви и Акурисхеви[1]"]
  - [Высота виноградников, "350–700 м над уровнем моря[1]"]
  - [Сорта, "белое — Ркацители ≥ 85 % + Мцване Кахури ≤ 15 %; красное — только Саперави[1]"]
